<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="compliant-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#compliant-bg)"/>

  <!-- Top Official Primary Logo -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#ffffff"/>
    <path d="M 22 32 L 28 38 L 42 24" fill="none" stroke="#0f766e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">ACME ENTERPRISE</text>
    <text x="84" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#99f6e4" letter-spacing="1">CLOUD INFRASTRUCTURE</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 230)">
    <rect width="240" height="38" rx="19" fill="#14b8a6" fill-opacity="0.25" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ccfbf1" text-anchor="middle" letter-spacing="1">ENTERPRISE CLOUD</text>
  </g>

  <!-- Headline -->
  <text x="80" y="370" font-family="system-ui, sans-serif" font-size="60" font-weight="900" fill="#ffffff" line-height="1.2">
    Engineered for
  </text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-size="60" font-weight="900" fill="#5eead4">
    Enterprise Reliability
  </text>

  <!-- Approved Core Architecture Card -->
  <g transform="translate(80, 500)">
    <rect width="920" height="130" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="40" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#99f6e4" letter-spacing="0.5">APPROVED FACTUAL BENCHMARK:</text>
    <text x="40" y="94" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
      "Documented 99.9% Uptime SLA with Multi-Region High Availability"
    </text>
  </g>

  <!-- Verified Statements -->
  <g transform="translate(80, 680)">
    <!-- Point 1 -->
    <circle cx="20" cy="24" r="14" fill="#0d9488"/>
    <path d="M 14 24 L 18 28 L 26 19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#f0fdfa">
      SOC-2 Type II and ISO 27001 verified security frameworks
    </text>

    <!-- Point 2 -->
    <circle cx="20" cy="84" r="14" fill="#0d9488"/>
    <path d="M 14 84 L 18 88 L 26 79" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="92" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#f0fdfa">
      Multi-layered defense model designed to mitigate attack surfaces
    </text>

    <!-- Point 3 -->
    <circle cx="20" cy="144" r="14" fill="#0d9488"/>
    <path d="M 14 144 L 18 148 L 26 139" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="152" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#f0fdfa">
      Automated failover architecture built for mission-critical uptime
    </text>
  </g>

  <!-- Mandatory Disclaimer & Fair Use Notice -->
  <g transform="translate(80, 930)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#115e59" stroke-width="1.5"/>
    <text x="0" y="36" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#99f6e4">
      SLA metrics reflect documented historical enterprise baseline. Results may vary by customer deployment.
    </text>
    <text x="0" y="64" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#5eead4">
      All registered trademarks and partner integrations are property of their respective owners. © 2026 Acme Enterprise.
    </text>
  </g>
</svg>
